name: 构建并推送修复镜像

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "patch_115_capacity.py"
      - "patch_drama_deep_search.py"
      - "patch_source_skip_notice.py"
      - "verify_searchfix.py"
      - "verify_source_notice.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      base_tag:
        description: "上游 base 镜像的 tag（如 26.9.6）"
        required: true
        default: "26.9.6"
      suffix:
        description: "镜像 tag 后缀：-115fix.3 = 累积三个补丁；-115fix = 覆盖旧 tag"
        required: true
        default: "-115fix.3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推 ghcr.io 需要
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名与 tag（GHCR 要求全小写）
        id: img
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
          echo "base=${{ github.event.inputs.base_tag || '26.9.6' }}" >> "$GITHUB_OUTPUT"
          echo "suffix=${{ github.event.inputs.suffix || '-115fix.3' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64        # 你的极空间 Z4S 是 x86_64
          build-args: |
            BASE_IMAGE=wuanqicll/cloud-save-max:${{ steps.img.outputs.base }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.base }}${{ steps.img.outputs.suffix }}
            ${{ steps.img.outputs.name }}:latest-115fix
